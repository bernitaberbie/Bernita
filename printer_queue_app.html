<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Printer Queue Management System</title><style>body{margin:0;padding:24px;background:#f5f2ff;color:#242038;font-family:Arial,sans-serif}main{max-width:680px;margin:auto;background:white;padding:24px;border-radius:18px;box-shadow:0 8px 28px #30205a18}h1{color:#5d3b91}p{line-height:1.5}.row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}input,button{font:inherit;padding:12px;border-radius:9px}input{flex:1;min-width:180px;border:1px solid #c9c2d8}button{border:0;background:#6c49a4;color:white;cursor:pointer}.secondary{background:#e9e2f5;color:#38215e}li{padding:8px;margin:5px 0;background:#f7f4fc;border-radius:7px}#status{min-height:24px;color:#5d3b91;font-weight:bold}.small{font-size:.9rem;color:#655d72}</style></head><body><main><h1>Printer Queue Management System</h1><p>This demo follows FIFO: the first document added is the first document processed.</p><div class="row"><input id="docName" placeholder="Document name (e.g. Assignment.pdf)" aria-label="Document name"><button onclick="addDocument()">Add document</button></div><div class="row"><button onclick="printNext()">Print next document</button><button class="secondary" onclick="showQueue()">Refresh queue</button><button class="secondary" onclick="clearQueue()">Clear queue</button></div><p id="status" role="status">Ready.</p><h2>Documents waiting to be printed</h2><ol id="queueList"></ol><p class="small">This browser demo simulates printing; it does not send files to a physical printer.</p></main><script>const queue=[];function setStatus(m){document.getElementById('status').textContent=m}function addDocument(){const f=document.getElementById('docName'),n=f.value.trim();if(!n){setStatus('Please enter a document name.');return}queue.push(n);f.value='';showQueue();setStatus(n+' added to the queue.');f.focus()}function printNext(){if(!queue.length){setStatus('No documents are waiting to be printed.');return}const n=queue.shift();showQueue();setStatus('Printing simulated: '+n+'. Document processed.')}function showQueue(){const l=document.getElementById('queueList');l.replaceChildren();if(!queue.length){const li=document.createElement('li');li.textContent='Queue is empty.';l.appendChild(li);return}queue.forEach(n=>{const li=document.createElement('li');li.textContent=n;l.appendChild(li)})}function clearQueue(){queue.length=0;showQueue();setStatus('Queue cleared.')}document.getElementById('docName').addEventListener('keydown',e=>{if(e.key==='Enter')addDocument()});showQueue();</script></body></html>
